name: toolbox-continuous-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  continuous-release-build:
    name: toolbox-continuous-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: go get .

      - name: Build all platforms
        run: |
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o toolbox.linux.amd64
          
          # Darwin ARM64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o toolbox.darwin.arm64
          
          # Darwin AMD64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o toolbox.darwin.amd64
          
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o toolbox.windows.amd64.exe

      - name: Verify builds
        run: |
          ls -lh toolbox.*
          echo "All platform builds completed successfully"
